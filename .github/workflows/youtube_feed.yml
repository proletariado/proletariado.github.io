name: YouTube Feed Cache

on:
  schedule:
    - cron: "30 5 * * *"  # runs daily at 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run YouTube feed script
        run: python .github/scripts/youtube_feed.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/youtube.json
          git commit -m "Update YouTube feed JSON" || echo "No changes to commit"
          git pull --rebase
          git push
