name: Steam Updates

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-updates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests

      - name: Run Steam build scraper
        run: python .github/scripts/steam_updates.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/temp.json

          if git diff --staged --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Steam patch notes JSON"

          # Other workflows push to the same branch, so retry if we lose a race
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin HEAD:"${GITHUB_REF_NAME}" \
              && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          exit 1
